<!DOCTYPE html>
<html>
<head>
  <title>SendDocu Dashboard</title>
  <script src="/auth.js"></script>
</head>
<body>

<h2>Dashboard</h2>
<button onclick="doLogout()">Logout</button>
<script src="/auth.js"></script>
<script src="/mailgrid.js"></script>
<script>
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.replace("/login.html");
  });
</script>

<section id="mailGrid">
  <h3>📬  Mail Grid</h3>

  <table border="1" width="100%" cellpadding="8">
    <thead>
      <tr>
        <th>ID</th>
        <th>Subject</th>
        <th>Recipients</th>
        <th>Status</th>
        <th>Created</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="mailGridBody">
      <tr>
        <td colspan="6">Loading...</td>
      </tr>
    </tbody>
  </table>
</section>

<button id="logoutBtn">Logout</button>

<script src="/auth.js"></script>
<script src="/mailgrid.js"></script>


<script>
requireAuth();
</script>

</body>
</html>
